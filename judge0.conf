# Judge0 CE Configuration
# Mounted read-only by judge0-server and judge0-worker containers.
# Do NOT commit production passwords. For local dev, simple values are fine.

# ── Redis (Judge0's internal queue) ──────────────────────────────────────────
REDIS_HOST=judge0-redis
REDIS_PORT=6379
# No password for internal dev Redis (not exposed on host)

# ── PostgreSQL (Judge0's internal metadata DB) ────────────────────────────────
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0local

# ── Sandbox resource limits ───────────────────────────────────────────────────
# These are per-submission defaults; individual submissions can override per request.
CPU_TIME_LIMIT=5
WALL_TIME_LIMIT=10
MEMORY_LIMIT=256000
STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=4096
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# ── Authentication ────────────────────────────────────────────────────────────
# Empty token = no auth for local development.
# In production: set a strong random token here AND in application-prod.yml.
AUTHN_HEADER=X-Judge0-Token
AUTHN_TOKEN=
