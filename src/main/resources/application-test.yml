spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

submission:
  rate-limit:
    enabled: false

jwt:
  access-token:
    secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWxvbmctc2VjcmV0LWtleS1mb3ItYWNjZXNzLXRva2Vu
    expiry-seconds: 3600
  refresh-token:
    secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWxvbmctc2VjcmV0LWtleS1mb3ItcmVmcmVzaC10b2tlbg==
    expiry-seconds: 86400
  cookie:
    secure: false
# The test profile runs on H2 with no Redis credentials; keep /actuator/health about the app itself
management:
  health:
    redis:
      enabled: false
