spring:
  profiles:
    active: local
  application:
    name: codepulse-backend
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate     # Flyway owns the schema, Hibernate never auto-generates
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.codepulse: DEBUG
    org.flywaydb: DEBUG

jwt:
  access-token:
    # No default here: local/test profiles supply dev keys, every other profile must set the env var
    secret: ${JWT_ACCESS_SECRET}
    expiry-seconds: 900
  refresh-token:
    secret: ${JWT_REFRESH_SECRET}
    expiry-seconds: 604800       # 7 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

codepulse:
  import:
    max-payload-bytes: 1048576      # 1 MB, measured in UTF-8 bytes
    max-questions: 200
    default-time-limit-ms: 2000      # 2 seconds
    default-memory-limit-kb: 262144  # 256 MB