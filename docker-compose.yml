services:
  # ── Existing application services ─────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: codepulse-postgres
    environment:
      POSTGRES_DB: codepulse
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: codepulse_local
    ports:
      # Host port comes from .env (DB_PORT) — use 5433 if a native PostgreSQL already holds 5432
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codepulse-redis
    # Queue jobs carry hidden test inputs and expected outputs: password-protect
    # Redis and publish it on loopback only.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-codepulse_redis_local}"]
    ports:
      - "127.0.0.1:6379:6379"

  # ── Judge0 CE (self-hosted code execution engine) ─────────────────────────
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: codepulse-judge0-server
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      JUDGE0_CONFIG_FILE: /judge0.conf
    privileged: true           # required for isolate sandboxing
    restart: always
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: codepulse-judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      JUDGE0_CONFIG_FILE: /judge0.conf
    privileged: true
    restart: always
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:16
    container_name: codepulse-judge0-db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0local
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: codepulse-judge0-redis
    # NOT exposed on host — only reachable within the Docker network

volumes:
  pg_data:
  judge0_pg_data: